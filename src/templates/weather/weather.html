<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ css }}">
    <style>
        @font-face {
            font-family: Harmony;
            src: url("{{ font }}");
        }

        body {
            font-family: Harmony, sans-serif;
            background-color: #fff;
            color: #2c3e50;
            text-align: center;
            transform: scale(1.5);
            transform-origin: center top;
        }

        .weather-container {
            max-width: 400px;
            margin: 50px auto;
            background: #fff;
            padding: 24px;
            border-radius: 4px;
            border: 1px solid #e7ebef;
        }

        .report-header {
            margin-bottom: 20px;
            padding: 20px 24px;
            background: #f8f9fa;
            border: 1px solid #e7ebef;
            border-radius: 4px;
            text-align: left;
        }

        .report-title { margin: 0; color: #2c3e50; font-size: 30px; }
        .report-subtitle { margin: 8px 0 0; color: #666; font-size: 18px; }

        .weather-summary {
            padding: 16px;
            background: #f8f9fa;
            border: 1px solid #e7ebef;
            border-radius: 4px;
        }

        .temperature-container {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .temperature {
            font-size: 50px;
            margin: 10px 10px 10px 0;
        }

        .temp-range {
            font-size: 18px;
            text-align: left;
        }

        .weather-desc {
            font-size: 20px;
        }

        .details {
            margin-top: 15px;
            font-size: 14px;
        }

        .forecast {
            margin-top: 20px;
            padding: 16px;
            background: #f8f9fa;
            border: 1px solid #e7ebef;
            border-radius: 4px;
        }

        .forecast-item {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
        }

        footer {
            background: #f0f0f0;
            text-align: center;
            padding: 10px;
            font-size: 0.9em;
            color: #777;
            border-radius: 4px;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="weather-container">
        <header class="report-header">
            <h1 class="report-title">{{ name }}天气</h1>
            <p class="report-subtitle">实时天气与未来预报</p>
        </header>
        <div class="weather-summary">
        <div class="temperature-container">
            <div class="temperature">{{ current_temp }}</div>
            <div class="temp-range">{{ today_min_temp }} / {{ today_max_temp }}</div>
        </div>
        <div class="weather-desc"><i class="qi-{{ current_weather_icon }}-fill" style="margin-right: 5px;"></i>{{
            current_weather }}</div>
        <div class="details">
            💧湿度: {{ humidity }} | 🍃风速: {{ wind_speed }} | 🌡气压: {{ pressure }}
        </div>
        <div class="details">
            👕穿衣建议：<br>{{ cloth_advice }}
        </div>
        </div>
        <div class="forecast">
            {{ future_weather }}
        </div>
        <footer>Generated by Inkar-Suki<br>Weather Service by QWeather</footer>
    </div>
</body>

</html>
