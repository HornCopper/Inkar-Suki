<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <!--
        该代码协议与Inkar Suki仓库协议相同。
        禁止帝君和兔兔使用。
        禁止任何人商用。
        欢迎借鉴或用于开源项目。
        ——HornCopper
    -->
    <style>
        * { box-sizing: border-box; }

        body { margin: 0; background: #fff; color: #2c3e50; }

        .container {
            width: 1040px;
            padding: 24px;
            background: #fff;
        }

        .report-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            padding: 20px 24px;
            background: #f8f9fa;
            border: 1px solid #e7ebef;
            border-radius: 4px;
        }

        h1 { margin: 0; font-size: 30px; line-height: 1.2; }
        .report-subtitle { margin-top: 8px; color: #666; font-size: 18px; }
        .report-meta { text-align: right; color: #666; font-size: 18px; }
        .server-tag {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            background: var(--inkar-accent-surface, #e8f4ff);
            color: var(--inkar-accent-ink, #2c7be5);
            font-size: 20px;
        }

        .report-section { margin-top: 20px; }
        .section-title { margin: 0 0 12px; color: #2c3e50; font-size: 22px; }

        .item-table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border: 1px solid #e7ebef;
            box-shadow: 0 1px 3px rgba(0, 0, 0, .05);
        }

        .item-table th,
        .item-table td {
            padding: 14px 12px;
            border: 1px solid #e7ebef;
            text-align: center;
            font-size: 21px;
            white-space: nowrap;
        }

        .item-table th { background: #f8f9fa; color: #444; font-weight: 600; }
        .chart-panel { padding: 16px; border: 1px solid #e7ebef; border-radius: 4px; }
        #Chart { width: 100%; height: 360px; }

        footer {
            margin-top: 20px;
            padding: 15px;
            background: #f0f0f0;
            color: #777;
            text-align: center;
            font-size: 20px;
        }

        @font-face {
            font-family: Harmony;
            src: url("{{ custom_font }}");
        }

        body {
            font-family: Harmony, sans-serif;
            font-size: 24px;
        }
    </style>
</head>

<body>
    <main class="container">
        <header class="report-header">
            <div>
                <h1>{{ app_name }}</h1>
                <div class="report-subtitle">各平台金币价格与近期走势</div>
            </div>
            <div class="report-meta">
                <span class="server-tag">{{ server or "全服" }}</span>
                <div>生成于 {{ app_time }}</div>
            </div>
        </header>

        <section class="report-section">
            <h2 class="section-title">平台价格</h2>
            <table class="item-table">
                <thead>
                    <tr>
                        <th>日期</th>
                        <th>贴吧</th>
                        <th>万宝楼</th>
                        <th>DD373</th>
                        <th>UU898</th>
                    </tr>
                </thead>
                <tbody>{{ table_content }}</tbody>
            </table>
        </section>

        <section class="report-section">
            <h2 class="section-title">近期走势</h2>
            <div class="chart-panel"><div id="Chart"></div></div>
        </section>

        <footer>&copy; Inkar Suki · {{ saohua }}</footer>
    </main>

    <script src="https://inkar-suki.codethink.cn/Inkar-Suki-Docs/js/echarts.min.js"></script>
    <script>
        const chart = echarts.init(document.getElementById("Chart"), null, { devicePixelRatio: 2 });

        const option = {
            animation: false,
            tooltip: {
                trigger: "axis"
            },
            legend: {
                data: {{ platforms }}
            },
            xAxis: {
                type: "category",
                boundaryGap: false,
                data: {{ dates }}
            },
            yAxis: {
                type: "value",
                boundaryGap: [0, "100%"],
                min: 700,
                max: 1000
            },
            series: [
                {
                    name: "贴吧",
                    type: "line",
                    data: {{ tieba }},
                    smooth: true,
                    itemStyle: {
                        color: "#483D8B"
                    },
                    areaStyle: {
                        color: "rgba(72, 61, 139, 0.2)"
                    }
                },
                {
                    name: "万宝楼",
                    type: "line",
                    data: {{ wbl }},
                    smooth: true,
                    itemStyle: {
                        color: "#ff7043"
                    },
                    areaStyle: {
                        color: "rgba(255, 112, 67, 0.2)"
                    }
                },
                {
                    name: "DD373",
                    type: "line",
                    data: {{ dd373 }},
                    smooth: true,
                    itemStyle: {
                        color: "#30C701"
                    },
                    areaStyle: {
                        color: "rgba(48, 199, 1, 0.2)"
                    }
                },
                {
                    name: "UU898",
                    type: "line",
                    data: {{ uu898 }},
                    smooth: true,
                    itemStyle: {
                        color: "#5DA0ED"
                    },
                    areaStyle: {
                        color: "rgba(93, 160, 237, 0.2)"
                    }
                }
            ]
        };

        chart.setOption(option);
    </script>
</body>

</html>
