<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8" />
    <style>
        @font-face {
            font-family: Harmony;
            src: url("{{ font }}");
        }

        body {
            margin: 0;
            background-color: #fff;
            font-family: Harmony;
            color: #2c3e50;
        }

        .report {
            display: inline-block;
            padding: 24px;
            background: #fff;
        }

        .report-header {
            margin-bottom: 20px;
            padding: 20px 24px;
            background: #f8f9fa;
            border: 1px solid #e7ebef;
            border-radius: 4px;
        }

        .report-title { margin: 0; color: #2c3e50; font-size: 30px; }
        .report-subtitle { margin: 8px 0 0; color: #666; font-size: 18px; }

        .container {
            display: flex;
            justify-content: space-between;
            background-color: #fff;
            gap: 20px;
            padding: 18px;
            border: 1px solid #e7ebef;
            border-radius: 4px;
        }

        .box {
            flex: 1;
        }


        .box {
            border: 2px solid #000000;
            border-radius: 5px;
            padding: 18px;
            background-color: #eee;
            width: max-content;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .highlight {
            border-color: gold;
        }

        .icon-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .icon {
            width: 48px;
            height: 48px;
            object-fit: cover;
        }

        .label {
            font-size: 14px;
            white-space: nowrap;
        }

        footer {
            background: #f0f0f0;
            text-align: center;
            padding: 15px;
            font-size: 0.9em;
            color: #777;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <main class="report">
        <header class="report-header">
            <h1 class="report-title">试炼之地 · 翻牌模拟</h1>
            <p class="report-subtitle">翻牌结果与物品预览</p>
        </header>
        <div class="container">
            {{ boxes }}
        </div>
        <footer>翻牌模拟 | Inkar Suki: {{ saohua }}</footer>
    </main>
</body>

</html>
