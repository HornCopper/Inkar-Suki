<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    {{ css }}
    {{ js }}
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            background: #fff;
            font-family: Arial, sans-serif;
        }

        .background-container {
            width: 1120px;
            padding: 24px;
            background: #fff;
        }

        .blur-container {
            padding: 16px;
            background: #fff;
            border: 1px solid #e7ebef;
            border-radius: 4px;
        }

        .content {
            width: 100%;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            color: #2c3e50;
            text-align: center;
        }

        th,
        td {
            border: 1px solid #e7ebef;
            padding: 12px;
        }

        th { background: #f8f9fa; }

        .report-header {
            margin-bottom: 20px;
            padding: 20px 24px;
            background: #f8f9fa;
            border: 1px solid #e7ebef;
            border-radius: 4px;
        }

        .report-title { margin: 0; color: #2c3e50; font-size: 30px; }
        .report-subtitle { margin: 8px 0 0; color: #666; font-size: 18px; }

        @font-face {
            font-family: Harmony;
            src: url("{{ font }}");
        }

        body {
            font-family: Harmony, sans-serif;
        }
    </style>
</head>

<body>
    <div class="background-container">
        <header class="report-header">
            <h1 class="report-title">{{ player_name }} · 最近对局</h1>
            <p class="report-subtitle">雀魂对局记录</p>
        </header>
        <div class="blur-container">
            <div class="content">
                <table>
                    <thead>
                        <tr>
                            <th>等级</th>
                            <th>顺位</th>
                            <th>一位</th>
                            <th>二位</th>
                            <th>三位</th>
                            <th>四位</th>
                            <th>时间</th>
                        </tr>
                    </thead>
                    <tbody>
                        {{ table_content }}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>

</html>
